
spring.application.name=autos-colombia
server.port=8080

# Configuración de la base de datos MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autos_colombia?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuración de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Bootstrap inicial de cuentas del personal. El usuario administrador es obligatorio.
app.security.bootstrap-admin.username=${APP_SECURITY_BOOTSTRAP_ADMIN_USERNAME:}
app.security.bootstrap-admin.password=${APP_SECURITY_BOOTSTRAP_ADMIN_PASSWORD:}
app.security.bootstrap-operator.username=${APP_SECURITY_BOOTSTRAP_OPERATOR_USERNAME:}
app.security.bootstrap-operator.password=${APP_SECURITY_BOOTSTRAP_OPERATOR_PASSWORD:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Manejo de errores
server.error.include-message=never
